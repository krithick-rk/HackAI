[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "soc_analyzer"
version = "0.1.0"
description = "SoC Hardware Security Analyzer Foundation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
soc-analyzer = "soc_analyzer.cli:main"

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0"
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["soc_analyzer*"]

[tool.pytest.ini_options]
pythonpath = ["."]

